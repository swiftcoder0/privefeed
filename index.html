<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    background:#FDFDFC;
    font-family:'Inter',sans-serif;
    color:#161616;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    padding:32px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .frame{
    position:fixed;
    inset:18px;
    border:1px solid rgba(22,22,22,0.10);
    pointer-events:none;
  }
  .logo{
    width:min(360px, 62vw);
    height:auto;
    opacity:0;
    animation:fadeUp 1s ease 0.1s forwards;
  }
  .tagline{
    margin-top:22px;
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-weight:400;
    font-size:clamp(15px, 2.4vw, 19px);
    color:#4A4A4A;
    letter-spacing:0.01em;
    opacity:0;
    animation:fadeUp 1s ease 0.4s forwards;
  }
  .divider{
    width:46px;
    height:1px;
    background:#161616;
    margin:34px auto;
    opacity:0;
    animation:fadeUp 1s ease 0.7s forwards;
  }
  .coming-soon{
    font-size:12.5px;
    font-weight:600;
    letter-spacing:0.42em;
    text-transform:uppercase;
    color:#161616;
    opacity:0;
    animation:fadeUp 1s ease 0.9s forwards;
  }
  @keyframes fadeUp{
    from{opacity:0; transform:translateY(10px);}
    to{opacity:1; transform:translateY(0);}
  }
  .copyright{
    position:fixed;
    bottom:26px;
    left:0;
    right:0;
    text-align:center;
    font-size:11px;
    color:#9A9A9A;
    letter-spacing:0.03em;
  }
  @media (prefers-reduced-motion: reduce){
    .logo,.tagline,.divider,.coming-soon{animation:none !important;opacity:1 !important;transform:none !important;}
  }
</style>
